# Reminders (docs/gamification-plan.md, phase 4): every 15 minutes, asks the app
# to send what is due. Vercel's free plan runs its own cron only once a day.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL       the app's address, such as https://example.vercel.app
#   CRON_TOKEN   the same value as CRON_TOKEN on Vercel
# Without them the job does nothing.
name: Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the app to send reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "APP_URL or CRON_TOKEN is not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "${APP_URL%/}/api/cron/notify" \
            -H "Authorization: Bearer ${CRON_TOKEN}"
